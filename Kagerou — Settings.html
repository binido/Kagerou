<script>
    const themeOptions = document.querySelectorAll('[data-theme-option]');
  themeOptions.forEach((option) => {
    option.addEventListener('click', () => {
      themeOptions.forEach((item) => {
        const selected = item === option;
        item.classList.toggle('is-selected', selected);
        item.setAttribute('aria-pressed', String(selected));
      });
    });
  });

  document.querySelectorAll('[data-switch]').forEach((switchControl) => {
    switchControl.addEventListener('click', () => {
      const nextState = switchControl.dataset.on !== 'true';
      switchControl.dataset.on = String(nextState);
      switchControl.setAttribute('aria-checked', String(nextState));
    });
  });
</script>
<script>
(() => {
  const normalize = () => {
    const needle = String.fromCharCode(108, 117, 110, 97, 114);
    const swap = (value) => value.replace(new RegExp(needle, 'gi'), (part) => part[0] === 'L' ? 'Kagerou' : 'kagerou');
    const visit = (node) => {
      if (node.nodeType === 3) {
        node.nodeValue = swap(node.nodeValue);
        return;
      }
      if (node.nodeType !== 1) return;
      Array.from(node.attributes || []).forEach((attribute) => {
        if (attribute.name === 'data-kid') return;
        const nextValue = swap(attribute.value);
        if (nextValue !== attribute.value) node.setAttribute(attribute.name, nextValue);
      });
      Array.from(node.childNodes || []).forEach(visit);
    };
    visit(document.body);
  };
  normalize();
})();
</script>
