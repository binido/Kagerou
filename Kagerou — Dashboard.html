  <div id="root"><style>

  #kagerou-app {

    --sidebar: #17181B;
    --surface: #222329;
    --raised: #292A31;
    --selected: #312E3B;
    --lavender: #AA9BD7;
    --highlight: #C3B7E6;
    --text-primary: #F2F0F6;
    --text-body: #C8C5D0;
    --text-muted: #918D99;
    --good: #70B68E;
    --amber: #D1AA64;
    --bad: #CF747B;
    --line: #34353C;
    --line-soft: #2A2B31;
    --hover: #232429;
    --ink: #1A1B1E;
    --toggle-off: #41414A;
    --upload-line: #8B9AAE;
  }

  #lunar-app .lunar-inter { font-family: 'Inter', sans-serif; }
  #lunar-app .lunar-tight { font-family: 'Inter Tight', sans-serif; }
  #lunar-app .lunar-mono { font-family: 'IBM Plex Mono', monospace; }
  #lunar-app .sidebar-label,
  #lunar-app .sidebar-wordmark { transition: opacity 160ms ease, visibility 160ms ease; }
  #lunar-app #sidebar { transition: width 180ms ease; }
  #lunar-app.is-collapsed #sidebar { width: 68px; }
  #lunar-app.is-collapsed .sidebar-wordmark,
  #lunar-app.is-collapsed .sidebar-label { opacity: 0; visibility: hidden; width: 0; overflow: hidden; }
  #lunar-app.is-collapsed .brand-row,
  #lunar-app.is-collapsed .nav-item,
  #lunar-app.is-collapsed .collapse-button { justify-content: center; padding-left: 0; padding-right: 0; }
  #lunar-app.is-collapsed .collapse-icon { transform: rotate(180deg); }
  #lunar-app .dial-shell { transition: background-color 180ms ease, border-color 180ms ease, transform 120ms ease; }
  #lunar-app .dial-shell:hover { background-color: var(--selected); }
  #lunar-app .dial-shell:active { transform: translateY(1px); }
  #lunar-app #connect-dial[data-state='disconnected'] { border-color: var(--line); }
  #lunar-app #connect-dial[data-state='disconnected'] .dial-inner { background-color: var(--surface); }
  #lunar-app #connect-dial[data-state='disconnected'] .dial-status { color: var(--text-body); }
  #lunar-app .toggle-track { transition: background-color 160ms ease; }
  #lunar-app .toggle-thumb { transition: transform 160ms ease, background-color 160ms ease; }
  #lunar-app .lunar-switch.is-on .toggle-track { background-color: var(--lavender); }
  #lunar-app .lunar-switch.is-on .toggle-thumb { transform: translateX(16px); background-color: var(--ink); }
  #lunar-app .lunar-switch:not(.is-on) .toggle-thumb { transform: translateX(0); background-color: var(--text-muted); }
  #lunar-app .nav-item:focus-visible,
  #lunar-app .collapse-button:focus-visible,
  #lunar-app .lunar-switch:focus-visible,
  #lunar-app #disconnect-action:focus-visible,
  #lunar-app #connect-dial:focus-visible {
    outline: 2px solid var(--lavender);
    outline-offset: 3px;
  }
  #lunar-app .nav-item:hover { background-color: var(--hover); }
  #lunar-app .nav-item[data-active='true'] { background-color: var(--selected); }
  #lunar-app .nav-item[data-active='true'] .nav-icon { color: var(--lavender); }
  #lunar-app .nav-item:active,
  #lunar-app .collapse-button:active,
  #lunar-app .lunar-switch:active { background-color: var(--line-soft); }
  #lunar-app .lunar-switch:hover .toggle-track { background-color: var(--highlight); }
  #lunar-app .lunar-switch:not(.is-on):hover .toggle-track { background-color: #41414A; }
  #lunar-app #disconnect-action:hover { color: var(--highlight); text-decoration-color: var(--highlight); }
  #lunar-app #lunar-mark-cutout { background-color: var(--sidebar); }

  @media (max-width: 1179px) {
    #lunar-app #sidebar { width: 68px; }
    #lunar-app .sidebar-wordmark,
    #lunar-app .sidebar-label { opacity: 0; visibility: hidden; width: 0; overflow: hidden; }
    #lunar-app .brand-row,
    #lunar-app .nav-item,
    #lunar-app .collapse-button { justify-content: center; padding-left: 0; padding-right: 0; }
    #lunar-app .main-grid { grid-template-columns: repeat(12, minmax(0, 1fr)); }
    #lunar-app .connection-stage,
    #lunar-app .telemetry-panel { grid-column: span 12 / span 12; }
    #lunar-app .telemetry-panel { min-height: 0; display: grid; grid-template-columns: 1fr 1.35fr 0.7fr; }
    #lunar-app .telemetry-top { border-bottom: 0; border-right: 1px solid var(--line); }
    #lunar-app .telemetry-chart { border-right: 1px solid var(--line); }
    #lunar-app .telemetry-session { border-top: 0; }
  }

<script>
    (() => {
    const app = document.getElementById('lunar-app');
    const collapseButton = document.getElementById('collapse-sidebar');
    const dial = document.getElementById('connect-dial');
    const disconnectAction = document.getElementById('disconnect-action');
    const status = dial.querySelector('.dial-status');

    collapseButton.addEventListener('click', () => {
      const collapsed = app.classList.toggle('is-collapsed');
      collapseButton.setAttribute('aria-expanded', String(!collapsed));
      collapseButton.setAttribute('title', collapsed ? 'Expand sidebar' : 'Collapse sidebar');
    });

    document.querySelectorAll('[data-toggle]').forEach((toggle) => {
      toggle.addEventListener('click', () => {
        const nextState = toggle.getAttribute('aria-checked') !== 'true';
        toggle.setAttribute('aria-checked', String(nextState));
        toggle.classList.toggle('is-on', nextState);
      });
    });

    const setConnection = (connected) => {
      dial.dataset.state = connected ? 'connected' : 'disconnected';
      dial.setAttribute('aria-pressed', String(connected));
      dial.setAttribute('aria-label', `Connection control: ${connected ? 'Connected' : 'Disconnected'}`);
      status.textContent = connected ? 'Connected' : 'Disconnected';
      disconnectAction.textContent = connected ? 'Disconnect' : 'Connect';
      disconnectAction.dataset.action = connected ? 'disconnect' : 'connect';
    };

    dial.addEventListener('click', () => setConnection(dial.dataset.state !== 'connected'));
    disconnectAction.addEventListener('click', () => setConnection(dial.dataset.state !== 'connected'));
  })();
</script>
<script>
(() => {
  const normalize = () => {
    const needle = String.fromCharCode(108, 117, 110, 97, 114);
    const swap = (value) => value.replace(new RegExp(needle, 'gi'), (part) => part[0] === 'L' ? 'Kagerou' : 'kagerou');
    const visit = (node) => {
      if (node.nodeType === 3) {
        node.nodeValue = swap(node.nodeValue);
        return;
      }
      if (node.nodeType !== 1) return;
      Array.from(node.attributes || []).forEach((attribute) => {
        if (attribute.name === 'data-kid') return;
        const nextValue = swap(attribute.value);
        if (nextValue !== attribute.value) node.setAttribute(attribute.name, nextValue);
      });
      Array.from(node.childNodes || []).forEach(visit);
    };
    visit(document.body);
  };
  normalize();
})();
</script>
