name: Release

# Tagging is the trigger: `git tag v0.1.0 && git push origin v0.1.0`.
# The tag must match the version in tauri.conf.json, which is checked first.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A tag that disagrees with the manifest would ship installers whose
      # in-app version is not the one people downloaded.
      - name: Check the tag against tauri.conf.json
        run: |
          manifest=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, tauri.conf.json says $manifest — bump the manifest or retag"
            exit 1
          fi
          echo "version $manifest"

  release:
    name: ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Linux (x86_64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - label: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Tauri's Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      # tauri.conf.json's beforeBuildCommand builds the frontend, so its
      # dependencies have to be there before the Tauri build starts. The same
      # command fetches the sing-box core for the target being built —
      # TAURI_ENV_TARGET_TRIPLE tells the script which one to pull.
      # The root package holds the Tauri CLI that tauri-action drives; app/
      # holds the frontend that beforeBuildCommand builds.
      - run: pnpm install --frozen-lockfile

      - run: pnpm install --frozen-lockfile
        working-directory: app

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc signing. Read only by the macOS bundler, so it is harmless
          # on the other runners. Without it the bundle carries only the
          # signature Rust's linker leaves on the executable, which seals no
          # resources and does not bind Info.plist — macOS calls that
          # "damaged" and offers nothing but the Trash. This does not make the
          # app notarised; it makes its signature valid.
          APPLE_SIGNING_IDENTITY: '-'
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: Kagerou ${{ github.ref_name }}
          releaseBody: |
            Bundles sing-box as its proxy core — nothing to install separately.

            **These builds are not notarised.** macOS may refuse to open the app; clear the quarantine flag it adds on download:

            ```
            xattr -dr com.apple.quarantine /Applications/Kagerou.app
            ```

            Windows SmartScreen will warn for the same reason — choose "More info", then "Run anyway".

            See the [roadmap](https://github.com/binido/Kagerou/blob/main/ROADMAP.md) for what works, what is half-built, and what is not there yet.
          # Left as a draft on purpose: check the artifacts, write the notes,
          # then publish. Note that GitHub's "latest release" endpoint — the
          # one the in-app update check reads — ignores drafts and
          # pre-releases alike, so nothing is announced until you publish.
          releaseDraft: true
          # A tag carrying a pre-release suffix (v0.2.0-alpha.1) is marked as
          # one; a plain vX.Y.Z is not.
          prerelease: ${{ contains(github.ref_name, '-') }}
