[package]
name = "kagerou"
# Inert: tauri.conf.json carries the app version and takes precedence over
# this field for everything user-facing. Bump it there, not here.
version = "0.0.0"
description = "A cleaner, cross-platform sing-box VPN client for desktop"
authors = ["Binido"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "kagerou_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
base64 = "0.22"
serde_yaml = "0.9"
url = "2"
percent-encoding = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
